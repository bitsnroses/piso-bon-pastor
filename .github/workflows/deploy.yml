# Build and publish to GitHub Pages (ADR-001 §7.1). The same steps as in local, on purpose:
# Node from .nvmrc, npm ci from the lockfile, astro build with the base in the environment.
# Pages source must be "GitHub Actions" (Settings > Pages). Content, privacy and link checks need the
# private workspace, so they run there (scripts/prepublish.sh) before each push; the job summary says so.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site under bitsnroses.github.io. "/" once the site has its own domain.
      BASE: /piso-bon-pastor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache optimised images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-
      - run: npm ci
      - run: npm run build
      - name: Checks not run here
        run: |
          {
            echo "### Checks not run in this workflow"
            echo "Content, privacy and link checks need the private workspace. Whoever edits runs \`scripts/prepublish.sh\` there, green, before every push to this repository."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Checks not run here::Content, privacy and link checks run in the private workspace (scripts/prepublish.sh) before each push."
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
